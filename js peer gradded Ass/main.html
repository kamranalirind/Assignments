<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Image Gallery</h1>

  <div id="image">
    Hover over an image below to display here.
  </div>

  <div class="preview">
    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb"
         alt="Beautiful mountain landscape"
         onmouseover="upDate(this)"
         onmouseout="undo()">

    <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
         alt="Mountain lake surrounded by trees"
         onmouseover="upDate(this)"
         onmouseout="undo()">

    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
         alt="Green forest with sunlight"
         onmouseover="upDate(this)"
         onmouseout="undo()">

    <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470"
         alt="Mountain landscape at sunset"
         onmouseover="upDate(this)"
         onmouseout="undo()">

    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
         alt="Lake and mountains in nature"
         onmouseover="upDate(this)"
         onmouseout="undo()">

    <img src="https://images.unsplash.com/photo-1511497584788-876760111969"
         alt="Forest trees and green leaves"
         onmouseover="upDate(this)"
         onmouseout="undo()">
  </div>

  <script src="javascript.js"></script>

</body>
</html>
