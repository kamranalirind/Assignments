<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exploring Nature</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Exploring Nature</h1>
        <p>Beautiful places and moments from the natural world</p>
    </header>

    <main>
        <figure>
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80"
                 alt="Mountain landscape with a lake and trees">
            <figcaption>Mountain Adventures</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80"
                 alt="Green valley surrounded by mountains">
            <figcaption>Peaceful Valleys</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80"
                 alt="Sunlight shining through a green forest">
            <figcaption>Forest Trails</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80"
                 alt="Blue ocean water meeting a sandy beach">
            <figcaption>Ocean Views</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80"
                 alt="Rocky mountains reflected in a calm lake">
            <figcaption>Quiet Lakes</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80"
                 alt="Sunlit landscape with mountains and green fields">
            <figcaption>Open Landscapes</figcaption>
        </figure>
    </main>

    <footer>
        <p>Created as a responsive web design project.</p>
    </footer>
</body>
</html>
